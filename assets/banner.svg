<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0a0e14 100%); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Glowing linear gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(33, 38, 45, 0.8)"/>
      <stop offset="100%" stop-color="rgba(22, 27, 34, 0.6)"/>
    </linearGradient>

    <!-- Radial ambient glows -->
    <radialGradient id="ambient-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <radialGradient id="ambient-purple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.18)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes shimmer {
      0% { stop-color: #58a6ff; }
      50% { stop-color: #bc8cff; }
      100% { stop-color: #39d353; }
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dash 3s linear infinite;
    }
    .badge-float-1 {
      animation: float1 4s ease-in-out infinite;
    }
    .badge-float-2 {
      animation: float2 5s ease-in-out infinite 0.5s;
    }
    .badge-float-3 {
      animation: float3 4.5s ease-in-out infinite 1s;
    }
    .ambient-pulse {
      animation: pulse 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Grids & Ambient Lights -->
  <rect width="1200" height="340" fill="#0d1117"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#ambient-cyan)" class="ambient-pulse"/>
  <rect width="1200" height="340" fill="url(#ambient-purple)" class="ambient-pulse"/>

  <!-- Background Dynamic Flow Lines (placed strictly behind cards/text) -->
  <path d="M 50 170 Q 300 50 600 170 T 1150 170" fill="none" stroke="rgba(88, 166, 255, 0.25)" stroke-width="2" class="flow-line"/>
  <path d="M 50 210 Q 350 310 700 200 T 1150 140" fill="none" stroke="rgba(188, 140, 255, 0.2)" stroke-width="2" class="flow-line" style="animation-direction: reverse;"/>
  <path d="M 200 20 Q 550 120 900 20 T 1150 80" fill="none" stroke="rgba(57, 211, 83, 0.15)" stroke-width="1.5" class="flow-line"/>

  <!-- Dynamic Floating Feature Pills (Right & Background Accents) -->
  <g class="badge-float-1" transform="translate(930, 45)">
    <rect width="210" height="42" rx="21" fill="url(#card-grad)" stroke="rgba(88, 166, 255, 0.4)" stroke-width="1"/>
    <circle cx="24" cy="21" r="6" fill="#39d353" filter="url(#glow-blur)"/>
    <text x="40" y="26" fill="#e6edf3" font-size="13" font-weight="600" letter-spacing="0.5">💬 Team Chat &amp; Audio</text>
  </g>

  <g class="badge-float-2" transform="translate(900, 145)">
    <rect width="240" height="42" rx="21" fill="url(#card-grad)" stroke="rgba(188, 140, 255, 0.4)" stroke-width="1"/>
    <circle cx="24" cy="21" r="6" fill="#bc8cff" filter="url(#glow-blur)"/>
    <text x="40" y="26" fill="#e6edf3" font-size="13" font-weight="600" letter-spacing="0.5">⚡ Incident Playbooks</text>
  </g>

  <g class="badge-float-3" transform="translate(940, 245)">
    <rect width="200" height="42" rx="21" fill="url(#card-grad)" stroke="rgba(57, 211, 83, 0.4)" stroke-width="1"/>
    <circle cx="24" cy="21" r="6" fill="#58a6ff" filter="url(#glow-blur)"/>
    <text x="40" y="26" fill="#e6edf3" font-size="13" font-weight="600" letter-spacing="0.5">🔒 Self-Hosted &amp; P2P</text>
  </g>

  <!-- Foreground Main Branding & Titles (Unobstructed, High Contrast) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill -->
    <rect width="220" height="30" rx="15" fill="rgba(88, 166, 255, 0.12)" stroke="rgba(88, 166, 255, 0.35)" stroke-width="1"/>
    <text x="16" y="20" fill="#58a6ff" font-size="11.5" font-weight="700" letter-spacing="1.5">🚀 CURATED DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="url(#primary-glow)" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Developer</text>
    <text x="0" y="130" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">Collaboration Platforms</text>

    <!-- Subtitle -->
    <text x="0" y="172" fill="#8b949e" font-size="17" font-weight="400" letter-spacing="0.2">
      Enterprise SaaS &amp; Open-Source Self-Hosted Messaging, DevOps Incident Playbooks &amp; Matrix Fediverse
    </text>

    <!-- Decorative status dot & live badge -->
    <g transform="translate(0, 198)">
      <circle cx="6" cy="6" r="5" fill="#39d353">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="10" fill="#39d353" font-size="12" font-weight="600" letter-spacing="0.8">UPDATED FOR 2026</text>

      <text x="160" y="10" fill="#6e7681" font-size="12">•</text>
      <text x="175" y="10" fill="#8b949e" font-size="12" font-weight="500">Slack • Mattermost • Zulip • Teams • Rocket.Chat • Element</text>
    </g>
  </g>

  <!-- Sleek Border Accent -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <rect x="0" y="336" width="1200" height="4" fill="url(#primary-glow)"/>
</svg>
